<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>學生管理・數學家教</title>
<style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--bg:#f5f6f2;--card:#fff;--ink:#233832;--muted:#627168;--line:#dfe7de;--soft:#f1f5ef;--accent:#2b6754;--danger:#b84339;--warn:#99641a;color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--bg:#141d1a;--card:#1d2924;--ink:#e4ede7;--muted:#a5b4aa;--line:#34433a;--soft:#24322b;--accent:#a5d4b8;--danger:#ffaba1;--warn:#f5c36d}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink)}main{width:min(100% - 32px,880px);margin:28px auto 170px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:0}p{color:var(--muted);font-size:14px;line-height:1.8;margin:8px 0}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:15px;min-height:48px}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select{touch-action:manipulation}.card{padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--card);margin-top:24px}.row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.greeting-preview{font-size:14px;margin:8px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:block;font-size:16px;font-weight:600;min-width:0}.field small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}input[type=text],select,input[type=time]{display:block;width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:54px;border-radius:14px;padding:14px 16px;margin-top:9px;font-size:17px;min-width:0}input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}.toggle{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;min-height:46px;padding:10px 16px;color:var(--muted);background:var(--card);font-size:14px;font-weight:600;position:relative;cursor:pointer;white-space:nowrap}.toggle:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--soft)}.toggle input{position:absolute;opacity:0;width:1px;height:1px}.toggle:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:3px}.toggle:has(input:disabled){opacity:.5}.deadline-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}fieldset{margin:0;min-width:0;border:1px solid var(--line);background:var(--soft);padding:20px;border-radius:18px}legend{font-size:16px;font-weight:650;padding:0 6px}.schedule{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.schedule .field{font-size:14px;font-weight:500}.schedule input,.schedule select{background:var(--card);padding:12px;font-size:17px}.schedule input[type=time]{font-variant-numeric:tabular-nums;font-weight:600}.schedule input:disabled,.schedule select:disabled{opacity:.45}.danger{color:var(--danger)}.primary{background:var(--accent);color:#fff;border:0;font-weight:600}:root[data-theme=dark] .primary{color:#163524}.status{font-size:14px;line-height:1.7;color:var(--accent);white-space:pre-line}.status.error{color:var(--danger)}.dirty{font-size:14px;color:var(--muted);font-weight:600;margin:0}.dirty.changed{color:var(--warn)}.save-bar{position:fixed;z-index:10;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--card);padding:16px max(16px,calc((100vw - 880px)/2));box-shadow:0 -8px 30px #00000008;display:flex;gap:16px;justify-content:space-between;align-items:center}.save-buttons{display:flex;gap:10px}.save-bar .primary{min-width:180px}.badge{display:inline-block;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.add{width:100%;margin-top:24px;border-style:dashed;min-height:58px}.sources{margin-top:28px;border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--card)}summary{cursor:pointer;font-size:17px;font-weight:600}.links{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.links a{display:inline-block;border:1px solid var(--line);padding:12px 16px;border-radius:999px;text-decoration:none;font-size:14px}.catalog-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.catalog-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.catalog-preview span{font-size:13px;line-height:1.6;background:var(--soft);border-radius:9px;padding:7px 10px}.toast{position:fixed;z-index:20;top:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:14px 22px;border:1px solid var(--accent);border-radius:12px;background:var(--card);color:var(--accent);box-shadow:0 6px 26px #0002;font-size:15px}.back{margin-top:28px}
@media(max-width:680px){main{margin-top:18px;margin-bottom:220px}header{align-items:flex-start}h1{font-size:25px}.card{padding:20px 16px}.row-head{flex-direction:column;gap:12px}.card-actions{justify-content:flex-start}.grid{gap:18px 12px}.field{font-size:15px}input[type=text],select,input[type=time]{padding:13px 12px;font-size:16px}.deadline-grid{grid-template-columns:1fr;gap:20px}fieldset{padding:18px}.save-bar{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px}.save-buttons{justify-content:stretch}.save-buttons button{flex:1}.save-bar .primary{min-width:0}.dirty{font-size:13px}.status{font-size:13px}.toast{width:max-content;text-align:center}.badge{font-size:11px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.schedule{gap:10px}.card-actions button,.toggle{font-size:13px;padding:10px 12px}.save-buttons button{font-size:13px;padding:12px}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('math-upload-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script></head><body><main>
<header><div><span class="badge">公開管理頁</span><h1>學生與繳交時間</h1><p>點選年級、出版社，設定每週的繳交提醒。</p></div><button id="theme" type="button">切換明暗</button></header>
<p class="muted">此頁開放查看與編輯。年級每年 7/1 自動升級，2/1 切換下學期；截止時間皆為台北時間。</p>
<div id="students" aria-label="學生設定"></div>
<button id="add" class="add" type="button" disabled>新增一位學生</button>
<div class="save-bar"><div><p id="dirty" class="dirty">尚未載入設定</p><p id="status" class="status" role="status" aria-live="polite">正在讀取設定…</p></div><div class="save-buttons"><button id="reload" type="button">重新載入</button><button id="save" class="primary" type="button" disabled>儲存全部設定</button></div></div>
<details class="sources"><summary>教材來源與維護</summary><p>前台依學生的出版社與年級顯示對應章節。出版社未來改版時，可更新章節資料後部署。</p><div class="links"><a href="https://nanidigi.nani.com.tw/" target="_blank" rel="noopener">南一資源</a><a href="https://digitalmaster.knsh.com.tw/j/math/" target="_blank" rel="noopener">康軒數學</a><a href="https://mathvideo.hle.com.tw/" target="_blank" rel="noopener">翰林數學</a></div><div class="catalog-controls"><label class="field">出版社<select id="catalog-publisher" aria-label="預覽出版社"></select></label><label class="field">學期<select id="catalog-term" aria-label="預覽學期"></select></label></div><div id="catalog-preview" class="catalog-preview"></div></details>
<p style="margin-top:28px"><a href="https://lee200202.github.io/parent-homework-upload/" target="_top">回到作業繳交</a></p>
</main><div class="toast" id="toast" role="status" hidden></div><script>
'use strict';const $=id=>document.getElementById(id);let config,busy=false,dirty=false;
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'連線失敗，請重試。')))[name](...args))}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!=null)el.textContent=text;return el}
function select(options,value){const el=document.createElement('select');for(const [v,label]of options)el.append(new Option(label,v));el.value=String(value);return el}
function field(label,control,key){const l=node('label','field',label);control.dataset.field=key;l.append(control);return l}
function input(value,max=30){const el=document.createElement('input');el.type='text';el.maxLength=max;el.value=value||'';return el}

function dirtyState(value){dirty=value;$('dirty').textContent=value?'您有尚未儲存的修改':'所有修改已儲存';$('dirty').classList.toggle('changed',value)}
let toastTimer;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function toggleControl(checkbox,on,off){const label=node('label','toggle');const text=node('span');function update(){text.textContent=checkbox.checked?on:off}checkbox.addEventListener('change',update);update();label.append(checkbox,text);return label}
function schedule(kind,value){
  const f=document.createElement('fieldset');f.dataset.schedule=kind;f.append(node('legend','',kind==='homework'?'每週作業截止':'每週考試截止'));
  const enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=value.enabled;enabled.setAttribute('aria-label',(kind==='homework'?'作業':'考試')+'啟用截止提醒');f.append(toggleControl(enabled,'已啟用','已關閉'));
  const weekday=select([[1,'每週一'],[2,'每週二'],[3,'每週三'],[4,'每週四'],[5,'每週五'],[6,'每週六'],[0,'每週日']],value.weekday);
  const time=document.createElement('input');time.type='time';time.value=value.time;
  const r=node('div','schedule');r.append(field('截止星期',weekday,'weekday'),field('截止時間',time,'time'));f.append(r);
  function toggle(){weekday.disabled=!enabled.checked;time.disabled=!enabled.checked}enabled.addEventListener('change',toggle);toggle();return f;
}
function studentCard(s,index){
  const card=node('section','card');card.dataset.id=s.id||'';const h=node('div','row-head'),heading=node('div'),title=node('h2','',s.name||'新學生'),preview=node('p','greeting-preview');heading.append(title,preview);h.append(heading);
  const controls=node('div','card-actions');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=s.active!==false;checkbox.dataset.field='active';checkbox.setAttribute('aria-label','前台顯示');controls.append(toggleControl(checkbox,'前台顯示中','前台已隱藏'));
  const remove=node('button','danger','移除');remove.type='button';remove.dataset.action='remove';remove.addEventListener('click',()=>{
    if(!card.dataset.id){if($('students').children.length<=1){status('請至少保留一位學生。',true);return}card.remove();dirtyState(true);return}
    if(!confirm('將「'+(name.value||s.name)+'」從前台隱藏？繳交紀錄會保留，可用顯示開關恢復。'))return;
    checkbox.checked=false;checkbox.dispatchEvent(new Event('change',{bubbles:true}));toast('已隱藏學生，請儲存設定。');
  });controls.append(remove);h.append(controls);card.append(h);
  const name=input(s.name),nickname=input(s.greetingName);let autoNickname=!s.greetingName||s.greetingName===(s.name||'').slice(-2);nickname.placeholder='留空自動使用姓名後兩字';
  function updatePreview(){title.textContent=name.value.trim()||'新學生';preview.textContent='前台問候語預覽：'+(nickname.value.trim()||name.value.trim().slice(-2)||'同學')+'你好'}
  name.addEventListener('input',()=>{if(autoNickname)nickname.value=name.value.trim().slice(-2);updatePreview()});nickname.addEventListener('input',()=>{autoNickname=!nickname.value.trim();updatePreview()});
  const grid=node('div','grid');const full=field('學生全名',name,'name');full.append(node('small','','用於檔案自動命名'));const nick=field('親切稱呼',nickname,'greetingName');nick.append(node('small','','問候語用，可留空自動取後兩字'));
  grid.append(full,nick,field('目前年級',select([[7,'國一數學'],[8,'國二數學'],[9,'國三數學']],s.grade),'grade'),field('使用出版社',select(Object.entries(config.publishers),s.publisher),'publisher'));card.append(grid);
  const deadlines=node('div','deadline-grid');for(const kind of ['homework','exam'])deadlines.append(schedule(kind,s.deadlines[kind]));card.append(deadlines);
  card.addEventListener('input',()=>dirtyState(true));card.addEventListener('change',()=>dirtyState(true));updatePreview();return card;
}
function catalogPreview(){const list=$('catalog-preview');list.replaceChildren();const chapters=config?.catalogs?.[$('catalog-publisher').value]?.[$('catalog-term').value]||[];for(const chapter of chapters)for(const section of chapter[1])list.append(node('span','',section.join(' ')))}
function catalogControls(){if($('catalog-publisher').options.length)return;for(const [key,label] of Object.entries(config.publishers))$('catalog-publisher').append(new Option(label,key));for(const grade of [7,8,9])for(const term of [1,2])$('catalog-term').append(new Option({7:'國一',8:'國二',9:'國三'}[grade]+(term===1?'上':'下'),grade+'-'+term));const first=config.students[0];if(first){$('catalog-publisher').value=first.publisher;$('catalog-term').value=first.grade+'-1'}catalogPreview()}
$('catalog-publisher').addEventListener('change',catalogPreview);$('catalog-term').addEventListener('change',catalogPreview);
function render(){const area=$('students');area.replaceChildren();config.students.forEach((s,i)=>area.append(studentCard(s,i)));$('add').disabled=false;$('save').disabled=false;catalogControls()}
function read(){return [...$('students').children].map(card=>{const get=key=>card.querySelector('[data-field='+key+']');const deadlines={};for(const kind of ['homework','exam']){const row=card.querySelector('[data-schedule='+kind+']');deadlines[kind]={enabled:row.querySelector('input[type=checkbox]').checked,weekday:Number(row.querySelector('select').value),time:row.querySelector('input[type=time]').value}}return{id:card.dataset.id,name:get('name').value.trim(),greetingName:get('greetingName').value.trim()||get('name').value.trim().slice(-2),grade:Number(get('grade').value),publisher:get('publisher').value,active:get('active').checked,deadlines}})}
function lock(value){busy=value;document.querySelectorAll('button,input,select').forEach(el=>el.disabled=value);if(!value)render()}
async function load(){if(busy)return;try{busy=true;$('reload').disabled=true;config=await call('getAdminConfig');dirtyState(false);render();status('設定已載入。')}catch(e){status(e.message,true)}finally{busy=false;$('reload').disabled=false}}
$('add').addEventListener('click',()=>{const students=read();if(students.length>=100){status('最多可管理 100 位學生。',true);return}students.push({id:'',name:'',greetingName:'',grade:7,publisher:'nanyi',active:true,deadlines:{homework:{enabled:true,weekday:3,time:'18:00'},exam:{enabled:true,weekday:3,time:'18:00'}}});config.students=students;render();dirtyState(true);$('students').lastElementChild.querySelector('input[type=text]').focus()});
$('save').addEventListener('click',async()=>{if(busy||!config)return;const students=read();if(students.some(s=>!s.name)){status('請填寫每位學生的姓名。',true);return}config.students=students;lock(true);status('正在儲存…');try{config=await call('saveAdminConfig',{revision:config.revision,students});dirtyState(false);status('已儲存，前台將使用最新設定。');toast('設定已儲存並同步前台。')}catch(e){status(e.message,true)}finally{lock(false)}});
$('reload').addEventListener('click',()=>{if(dirty&&!confirm('重新載入會放棄尚未儲存的變更，確定重新載入？'))return;load()});$('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('math-upload-theme',document.documentElement.dataset.theme)}catch(e){}});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});load();
</script></body></html>
