<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>學生管理・數學家教</title>
<style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#233832;background:#f5f6f2;--bg:#f5f6f2;--card:#fff;--ink:#233832;--muted:#6a776e;--line:#dfe7de;--soft:#f1f5ef;--accent:#2b6754;--danger:#b84339;color-scheme:light}:root[data-theme=dark]{color-scheme:dark;--bg:#141d1a;--card:#1d2924;--ink:#e4ede7;--muted:#a5b4aa;--line:#34433a;--soft:#24322b;--accent:#a5d4b8;--danger:#ffaba1;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{width:min(100% - 32px,960px);margin:24px auto 48px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:29px;margin:8px 0}p{color:var(--muted);font-size:13px;line-height:1.7;margin:6px 0}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 15px;border-radius:999px;font-size:13px;min-height:42px}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card);margin-top:18px}.row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h2{font-size:17px;margin:0}.active{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:14px}label.field{display:block;font-size:12px;color:var(--muted)}input[type=text],select,input[type=time]{display:block;width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:44px;border-radius:9px;padding:9px 11px;margin-top:7px;font-size:14px;min-width:0}input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}.deadline-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}fieldset{margin:0;border:0;padding:0;min-width:0}legend{font-size:12px;margin-bottom:8px;color:var(--muted)}.schedule{display:grid;grid-template-columns:30px 1fr 1fr;align-items:center;gap:9px}.schedule select,.schedule input{margin-top:0}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}.primary{background:var(--accent);color:#fff;border:0;min-width:190px;font-weight:600}:root[data-theme=dark] .primary{color:#163524}.status{font-size:13px;line-height:1.7;color:var(--accent);white-space:pre-line}.status.error{color:var(--danger)}.muted{font-size:11px}details{margin-top:24px;font-size:12px;color:var(--muted)}summary{cursor:pointer}.links{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0}.badge{font-size:11px;background:var(--soft);border:1px solid var(--line);padding:5px 10px;border-radius:30px;color:var(--muted)}@media(max-width:680px){header{align-items:flex-start}.grid{grid-template-columns:1fr 1fr}.card{padding:18px}.deadline-grid{grid-template-columns:1fr;gap:15px}h1{font-size:25px}input[type=text],select,input[type=time]{font-size:16px}.actions{align-items:stretch}.primary{flex:1}.schedule{grid-template-columns:26px 1fr 1fr}}[hidden]{display:none!important}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('math-upload-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script></head><body><main>
<header><div><span class="badge">公開管理頁</span><h1>學生與繳交時間</h1><p>點選年級、出版社，設定每週的繳交提醒。</p></div><button id="theme" type="button">切換明暗</button></header>
<p class="muted">此頁開放查看與編輯。年級每年 7/1 自動升級，2/1 切換下學期；截止時間皆為台北時間。</p>
<div id="students" aria-label="學生設定"></div>
<div class="actions"><button id="add" type="button" disabled>＋ 新增學生</button><button id="save" class="primary" type="button" disabled>儲存全部設定</button><button id="reload" type="button">重新載入</button></div><p id="status" class="status" role="status" aria-live="polite">正在讀取設定…</p>
<details><summary>教材來源與維護</summary><p>前台依學生的出版社與年級顯示對應章節。出版社未來改版時，可更新章節資料後部署。</p><div class="links"><a href="https://nanidigi.nani.com.tw/" target="_blank" rel="noopener">南一資源</a><a href="https://digitalmaster.knsh.com.tw/j/math/" target="_blank" rel="noopener">康軒數學</a><a href="https://mathvideo.hle.com.tw/" target="_blank" rel="noopener">翰林數學</a></div></details>
<p style="margin-top:28px"><a href="https://lee200202.github.io/parent-homework-upload/" target="_top">← 回到作業繳交</a></p>
</main><script>
'use strict';const $=id=>document.getElementById(id);let config,busy=false,dirty=false;
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'連線失敗，請重試。')))[name](...args))}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!=null)el.textContent=text;return el}
function select(options,value){const el=document.createElement('select');for(const [v,label]of options)el.append(new Option(label,v));el.value=String(value);return el}
function field(label,control,key){const l=node('label','field',label);control.dataset.field=key;l.append(control);return l}
function input(value,max=30){const el=document.createElement('input');el.type='text';el.maxLength=max;el.value=value||'';return el}
function schedule(kind,value){const f=document.createElement('fieldset');f.dataset.schedule=kind;f.append(node('legend','',kind==='homework'?'作業截止':'考試截止'));const r=node('div','schedule');const enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=value.enabled;enabled.setAttribute('aria-label',(kind==='homework'?'作業':'考試')+'啟用截止提醒');const weekday=select([[1,'每週一'],[2,'每週二'],[3,'每週三'],[4,'每週四'],[5,'每週五'],[6,'每週六'],[0,'每週日']],value.weekday);weekday.setAttribute('aria-label','截止星期');const time=document.createElement('input');time.type='time';time.value=value.time;time.setAttribute('aria-label','截止時間');function toggle(){weekday.disabled=!enabled.checked;time.disabled=!enabled.checked}enabled.addEventListener('change',toggle);toggle();r.append(enabled,weekday,time);f.append(r);return f}
function studentCard(s,index){const card=node('section','card');card.dataset.id=s.id||'';const h=node('div','row-head');h.append(node('h2','',s.name||'新學生'));const active=node('label','active');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=s.active!==false;checkbox.dataset.field='active';active.append(checkbox,document.createTextNode('前台顯示'));h.append(active);card.append(h);const grid=node('div','grid');grid.append(field('學生姓名',input(s.name),'name'),field('問候稱呼',input(s.greetingName),'greetingName'),field('目前年級',select([[7,'國一數學'],[8,'國二數學'],[9,'國三數學']],s.grade),'grade'),field('出版社',select(Object.entries(config.publishers),s.publisher),'publisher'));card.append(grid);const deadlines=node('div','deadline-grid');for(const kind of ['homework','exam'])deadlines.append(schedule(kind,s.deadlines[kind]));card.append(deadlines);card.addEventListener('input',()=>{dirty=true});card.addEventListener('change',()=>{dirty=true});return card}
function render(){const area=$('students');area.replaceChildren();config.students.forEach((s,i)=>area.append(studentCard(s,i)));$('add').disabled=false;$('save').disabled=false}
function read(){return [...$('students').children].map(card=>{const get=key=>card.querySelector('[data-field='+key+']');const deadlines={};for(const kind of ['homework','exam']){const row=card.querySelector('[data-schedule='+kind+']');deadlines[kind]={enabled:row.querySelector('input[type=checkbox]').checked,weekday:Number(row.querySelector('select').value),time:row.querySelector('input[type=time]').value}}return{id:card.dataset.id,name:get('name').value.trim(),greetingName:get('greetingName').value.trim(),grade:Number(get('grade').value),publisher:get('publisher').value,active:get('active').checked,deadlines}})}
function lock(value){busy=value;document.querySelectorAll('button,input,select').forEach(el=>el.disabled=value);if(!value)render()}
async function load(){if(busy)return;try{busy=true;$('reload').disabled=true;config=await call('getAdminConfig');dirty=false;render();status('設定已載入。')}catch(e){status(e.message,true)}finally{busy=false;$('reload').disabled=false}}
$('add').addEventListener('click',()=>{const students=read();if(students.length>=100){status('最多可管理 100 位學生。',true);return}students.push({id:'',name:'',greetingName:'',grade:7,publisher:'nanyi',active:true,deadlines:{homework:{enabled:true,weekday:3,time:'18:00'},exam:{enabled:true,weekday:3,time:'18:00'}}});config.students=students;render();dirty=true;$('students').lastElementChild.querySelector('input[type=text]').focus()});
$('save').addEventListener('click',async()=>{if(busy||!config)return;const students=read();if(students.some(s=>!s.name)){status('請填寫每位學生的姓名。',true);return}config.students=students;lock(true);status('正在儲存…');try{config=await call('saveAdminConfig',{revision:config.revision,students});dirty=false;status('已儲存，前台將使用最新設定。')}catch(e){status(e.message,true)}finally{lock(false)}});
$('reload').addEventListener('click',()=>{if(dirty&&!confirm('重新載入會放棄尚未儲存的變更，確定重新載入？'))return;load()});$('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('math-upload-theme',document.documentElement.dataset.theme)}catch(e){}});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});load();
</script></body></html>
