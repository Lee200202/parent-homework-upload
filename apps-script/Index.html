  <style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--bg:#f5f6f2;--card:#fff;--ink:#233832;--muted:#627168;--line:#dfe7de;--soft:#f1f5ef;--accent:#2b6754;--accent-soft:#e8f1e8;--error:#b84339;color-scheme:light}

*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-width:280px;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button,summary{cursor:pointer}button,a,input,select,summary{touch-action:manipulation}button:disabled{cursor:default;opacity:.5}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:3px}svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.6}
.shell{width:min(100% - 40px,820px);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;gap:12px}.brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:4px 0;font-weight:650;font-size:17px;color:var(--ink);min-height:44px}.mark{display:grid;place-items:center;width:30px;height:30px;color:var(--accent)}.theme,.small-button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:44px;padding:10px 15px;font-size:14px}.theme{display:flex;gap:7px;align-items:center}.theme svg{width:16px;height:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}.student-row{display:flex;align-items:center;gap:14px}.student-label{font-size:14px;white-space:nowrap}.select-wrap{position:relative;flex:1;min-width:0}.select-wrap:after{content:'⌄';position:absolute;right:13px;top:11px;pointer-events:none;color:var(--muted)}select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);min-height:46px;padding:11px 13px;font-size:16px}select{padding-right:33px;appearance:none}.greeting{margin:10px 0 0;font-size:14px;color:var(--muted)}.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px;margin:16px 0}.tab{flex:1;border:0;border-radius:999px;padding:11px 8px;color:var(--muted);background:transparent;min-height:44px;font-size:15px}.tab[aria-selected=true]{color:var(--accent);background:var(--card);font-weight:650;box-shadow:0 1px 5px #0001}
.deadline-box{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 12px;background:var(--accent-soft);border-radius:14px;padding:10px 14px;margin-bottom:16px}.countdown{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.deadline-date{margin:0;font-size:12px;color:var(--muted)}.submission-fields{display:grid;gap:16px;margin-bottom:12px}fieldset{margin:0;padding:0;border:0;min-width:0}legend,.field-label{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}.pills{display:flex;gap:9px}.pill{position:relative;flex:1;cursor:pointer}.pill input{position:absolute;opacity:0;width:1px;height:1px}.pill span{display:block;padding:11px 8px;border:1px solid var(--line);border-radius:999px;text-align:center;background:var(--soft);font-size:16px;min-height:46px}.pill input:checked+span{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);font-weight:650}.pill input:focus-visible+span{outline:3px solid var(--accent);outline-offset:3px}.pill input:disabled+span{opacity:.5}.custom-field{margin-top:9px}.custom-field label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px}.content-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.content-head .field-label{margin:0}.term-wrap{flex:0 0 116px}.term-wrap select{min-height:40px;height:40px;padding-top:7px;padding-bottom:7px;font-size:14px}.term-wrap:after{top:8px}.filename-preview{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.drop{border:1px dashed var(--line);border-radius:14px;background:var(--soft);padding:14px}.drop.drag{background:var(--accent-soft);border-color:var(--accent)}.pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.picker{position:relative;display:flex;align-items:center;justify-content:center;min-height:54px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--accent);font-size:16px;font-weight:600;text-align:center;padding:10px;cursor:pointer}.file-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.picker:has(input:disabled){opacity:.5}.drop-help{font-size:12px;line-height:1.7;color:var(--muted);margin:10px 0 0;text-align:center}.notes-field{margin-top:14px;font-size:14px;color:var(--muted)}.notes-field summary{min-height:36px;padding:6px 0}.notes-field textarea{margin-top:8px;resize:vertical;min-height:90px;line-height:1.6}.error-box{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--error);background:var(--soft);padding:12px;border-radius:10px;font-size:14px;line-height:1.7;margin-top:14px}.queue{list-style:none;padding:0;margin:16px 0}.file{display:grid;grid-template-columns:62px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.file-icon{width:62px;height:70px;display:grid;place-items:center;background:var(--soft);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden}.file-icon img{width:100%;height:100%;object-fit:cover}.file-name{font-size:15px;font-weight:600;margin:0 0 5px;overflow-wrap:anywhere}.file-meta{font-size:12px;line-height:1.6;color:var(--muted);display:flex;gap:3px 10px;flex-wrap:wrap}.success{color:var(--accent)}.failed,.danger{color:var(--error)!important}.remove{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.done-icon{display:grid;place-items:center;color:var(--accent)}.progress{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.primary{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:#fff;border-radius:12px;min-height:50px;padding:13px 24px;font-size:16px;font-weight:600}:root[data-theme=dark] .primary{color:#163524}.summary{flex:1;min-width:180px;font-size:13px;color:var(--muted);line-height:1.7;margin:0}.summary.success{color:var(--accent)}.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.receipt{margin-top:20px;padding:20px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--line)}.receipt h3{font-size:21px;margin:0 0 10px}.receipt p{font-size:14px;line-height:1.7;margin:6px 0;overflow-wrap:anywhere}.receipt-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.replace-banner{font-size:14px;line-height:1.7;background:var(--accent-soft);padding:12px;border-radius:10px;margin-bottom:12px;overflow-wrap:anywhere}.replace-banner button{margin-top:8px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-head h3{margin:0;font-size:18px}.history-meta,.history-note,.history-empty{font-size:14px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}.history-card{padding:18px;border:1px solid var(--line);border-radius:14px;margin:14px 0}.history-name{font-size:15px;line-height:1.7;font-weight:600;margin:0 0 8px;overflow-wrap:anywhere}.history-note{padding:10px;border-radius:9px;background:var(--soft)}.history-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.history-actions a{text-decoration:none;display:inline-flex;align-items:center}.foot{font-size:12px;text-align:center;color:var(--muted);padding:18px 0 28px}dialog{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(92vw,820px);max-height:90dvh}dialog::backdrop{background:#07140dcc}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.dialog-head h3{margin:0;font-size:18px;line-height:1.6;overflow-wrap:anywhere}.preview-body img{display:block;max-width:100%;max-height:68dvh;margin:auto;object-fit:contain}.preview-body iframe{width:100%;height:68dvh;border:0;background:var(--soft)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.dialog-message{font-size:15px;line-height:1.8;color:var(--muted)}.skeleton{background:linear-gradient(100deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:loading 1.3s infinite}@keyframes loading{to{background-position:-200% 0}}
@media(max-width:540px){.shell{width:calc(100% - 24px)}.topbar{padding:10px 2px}.brand{font-size:16px}.theme{font-size:12px;padding:9px 12px}.card{padding:16px;border-radius:18px}.student-row{gap:10px}.student-label{font-size:13px}.tabs{margin:12px 0}.greeting{margin-top:7px;font-size:13px}.deadline-box{padding:9px 12px;margin-bottom:14px}.countdown{font-size:13px}.deadline-date{font-size:12px}.submission-fields{gap:12px}.picker{font-size:15px;min-height:52px}.drop{padding:11px}.drop-help{font-size:11px}.actions{gap:10px}.primary{width:100%}.summary{font-size:12px}.file{gap:9px;grid-template-columns:54px minmax(0,1fr) 40px}.file-icon{width:54px;height:64px}.history-card{padding:14px}.history-actions .small-button{font-size:13px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.connection{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}.connection button{min-height:36px;padding:6px 12px;font-size:12px}
/* Large flip clock is intentional: retained at the owner's request. */
.deadline-box{display:block;background:var(--soft);border:1px solid var(--line);padding:24px;margin:0 0 22px;border-radius:18px}.deadline-title{font-size:17px;font-weight:650;margin:0 0 18px}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;white-space:normal}.clock-unit{min-width:0;text-align:center}.countdown .clock-value{--flip-height:124px;--flip-font:84px;display:block;position:relative;height:var(--flip-height);border-radius:13px;background:var(--accent-soft);color:var(--ink);font-family:Arial,system-ui,sans-serif;font-size:var(--flip-font);font-variant-numeric:tabular-nums;font-weight:700;line-height:var(--flip-height);letter-spacing:-.055em;perspective:700px;isolation:isolate;box-shadow:0 5px 12px #00000009}.clock-value:after{content:'';position:absolute;z-index:5;top:50%;left:0;right:0;height:1px;background:var(--line);box-shadow:0 1px #ffffff18}.countdown .flip-part{display:block;position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--accent-soft);font:inherit;line-height:inherit;letter-spacing:inherit;backface-visibility:hidden}.countdown .flip-top{top:0;border-radius:13px 13px 0 0;filter:brightness(1.015)}.countdown .flip-bottom{bottom:0;border-radius:0 0 13px 13px;filter:brightness(.965)}.countdown .flip-glyph{position:absolute;left:0;right:0;top:0;height:var(--flip-height);display:block;font:inherit;line-height:var(--flip-height);letter-spacing:inherit;text-align:center;padding-right:.055em}.countdown .flip-bottom .flip-glyph{top:calc(var(--flip-height) / -2)}.countdown .turn-top{z-index:3;transform-origin:center bottom;animation:turnTop .24s ease-in forwards}.countdown .turn-bottom{z-index:4;transform-origin:center top;transform:rotateX(90deg);animation:turnBottom .24s .24s ease-out forwards}.countdown small{display:block;color:var(--muted);font-size:13px;margin-top:10px}.deadline-date{font-size:16px;line-height:1.7;margin:18px 0 0;color:var(--ink);font-weight:550}@keyframes turnTop{to{transform:rotateX(-90deg)}}@keyframes turnBottom{to{transform:rotateX(0)}}
@media(max-width:540px){.deadline-box{padding:17px 12px;margin-bottom:18px}.deadline-title{font-size:16px;margin-bottom:15px}.countdown{gap:7px}.countdown .clock-value{--flip-height:90px;--flip-font:clamp(32px,12vw,52px);border-radius:10px}.deadline-date{font-size:15px;margin-top:16px}.countdown small{font-size:12px;margin-top:9px}}@media(prefers-reduced-motion:reduce){.countdown .turn-top,.countdown .turn-bottom{display:none}}
</style>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('math-upload-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>

<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" id="brand" type="button" aria-label="數學家教"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 5h10M7 19h10M16 5l-7 7 7 7"/></svg></span>數學家教</button>
      <div class="controls"><button class="theme" id="theme" type="button" aria-label="切換暗黑模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><span id="theme-text">暗黑模式</span></button></div>
    </header>
    <main>
<section class="card" aria-label="檔案上傳">
        <div class="student-row"><label class="student-label" for="student">學生姓名</label><div class="select-wrap"><select id="student" class="skeleton" disabled><option value="">正在載入名單…</option></select></div></div>
        <p class="greeting" id="greeting">選擇學生後即可繳交</p>
        <span class="badge" id="course" hidden></span><div id="connection" class="connection" role="status"><span id="connection-text">正在連線確認最新名單…</span><button id="connection-retry" class="small-button" type="button">重試連線</button></div>
        <nav class="tabs" role="tablist" aria-label="作業功能"><button class="tab" id="tab-upload" type="button" role="tab" aria-selected="true" aria-controls="upload-panel">作業繳交</button><button class="tab" id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">作業查看</button></nav>
        <section id="upload-panel" role="tabpanel" aria-labelledby="tab-upload">
        <div class="deadline-box" id="deadline-box" hidden><p class="deadline-title" id="deadline-title">距離作業截止</p><div class="countdown" aria-live="off" role="timer" aria-label="距離截止時間"><div class="clock-unit"><span class="clock-value" id="due-days" aria-label="天">--</span><small>天</small></div><div class="clock-unit"><span class="clock-value" id="due-hours" aria-label="小時">--</span><small>小時</small></div><div class="clock-unit"><span class="clock-value" id="due-minutes" aria-label="分鐘">--</span><small>分鐘</small></div><div class="clock-unit"><span class="clock-value" id="due-seconds" aria-label="秒">--</span><small>秒</small></div></div><p class="deadline-date" id="deadline-date"></p></div>
        <div class="submission-fields">
          <fieldset id="category-group"><legend>這次繳交的是</legend><div class="pills">
            <label class="pill"><input type="radio" name="category" value="exam"><span>考試</span></label>
            <label class="pill"><input type="radio" name="category" value="homework" checked><span>作業</span></label>
            <label class="pill"><input type="radio" name="category" value="custom"><span>自訂</span></label>
          </div><div class="custom-field" id="custom-category-field" hidden><label for="custom-category">自訂類型</label><input id="custom-category" type="text" maxlength="30" placeholder="例如：課前資料" autocomplete="off"></div></fieldset>
          <div><div class="content-head"><label class="field-label" for="content">繳交內容 · <span id="publisher-label">南一版</span></label><div class="select-wrap term-wrap"><select id="term" aria-label="教材學期" disabled><option value="">載入中</option></select></div></div><div class="select-wrap"><select id="content"><option value="">請選擇內容</option></select></div><div class="custom-field" id="custom-content-field" hidden><label for="custom-content">自訂內容</label><input id="custom-content" type="text" maxlength="30" placeholder="例如：第一次段考訂正" autocomplete="off"></div></div>
          <p class="filename-preview" id="filename-preview">系統將自動命名歸檔，您無須手動改檔名。</p>
        </div>
        <div class="replace-banner" id="replace-banner" hidden><div id="replace-name"></div><button class="small-button" id="replace-cancel" type="button">取消重新上傳</button></div>
        <div class="drop" id="drop"><div class="pickers">
          <label class="picker" for="camera">直接拍照<input class="file-input" id="camera" type="file" accept="image/*" capture="environment" aria-label="直接拍照" disabled></label>
          <label class="picker" for="files">相簿／PDF 選檔<input class="file-input" id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.heic,.heif,.pdf,image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf" aria-label="選擇照片或 PDF" disabled></label>
        </div><p class="drop-help">每檔上限 10 MB · 可繼續補拍或拖入檔案<br>大張照片會自動縮小；PDF 保留原檔。</p></div>
        <details class="notes-field" id="notes-details"><summary>新增給老師的留言（選填）</summary><label for="upload-notes" hidden>給老師的留言</label><textarea id="upload-notes" maxlength="2000" placeholder="例如：第 3 題想請老師再講解一次。"></textarea></details>
        <div class="error-box" id="errors" role="alert" hidden></div>
        <ul class="queue" id="queue" aria-label="待上傳檔案"></ul>
        <div class="actions"><button class="primary" id="upload" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>開始上傳</span></button><p class="summary" id="summary" role="status" aria-live="polite">請等候「上傳成功」再關閉頁面。</p></div>
        <section class="receipt" id="receipt" hidden aria-labelledby="receipt-title"><h3 id="receipt-title">繳交完成</h3><p id="receipt-detail"></p><p id="receipt-time"></p><p id="receipt-codes"></p><div class="receipt-actions"><button class="small-button" id="again" type="button">再交一份</button><button class="small-button" id="receipt-history" type="button">查看紀錄</button></div></section>
        </section>
        <section id="history-panel" role="tabpanel" aria-labelledby="tab-history" hidden><div class="history-head"><h3>雲端繳交紀錄</h3><button id="history-refresh" class="small-button" type="button">重新整理</button></div><p class="history-meta">查看與管理已繳交檔案；可隨時重新整理。</p><div id="history-list"></div><p id="history-status" class="history-empty" role="status" aria-live="polite"></p><button class="small-button" id="history-more" type="button" hidden>載入更多</button></section>
      </section>
    </main>
    <footer class="foot">檔案交給老師，學習慢慢累積。</footer>
  </div>
  <dialog id="preview-dialog"><div class="dialog-head"><h3 id="preview-title">檔案預覽</h3><button class="small-button" id="preview-close" type="button">關閉</button></div><div class="preview-body" id="preview-body"></div></dialog>
  <dialog id="notes-dialog"><div class="dialog-head"><h3>修改附註</h3><button class="small-button" id="notes-close" type="button">取消</button></div><label class="field-label" for="edit-notes">附註（最多 2000 字）</label><textarea id="edit-notes" maxlength="2000"></textarea><p class="dialog-message" id="notes-status" role="status"></p><div class="dialog-actions"><button class="small-button" id="notes-save" type="button">儲存附註</button></div></dialog>
  <dialog id="trash-dialog"><div class="dialog-head"><h3>將檔案移至垃圾桶？</h3></div><p class="dialog-message" id="trash-name"></p><p class="dialog-message">移除後可由老師在 Google Drive 垃圾桶復原。</p><p class="dialog-message" id="trash-status" role="status"></p><div class="dialog-actions"><button class="small-button" id="trash-cancel" type="button">取消</button><button class="small-button danger" id="trash-confirm" type="button">移至垃圾桶</button></div></dialog>
  <script>
    'use strict';
    const $=id=>document.getElementById(id);
    const icons={file:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',remove:'<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>'};
    let config,items=[],busy=false,selecting=false,configFresh=false;
    const device=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'mobile':'desktop';
    function submission(){return {category:document.querySelector('input[name=category]:checked').value,customCategory:$('custom-category').value.trim(),publisher:selectedStudent()?.publisher,termKey:$('term').value,content:$('content').value,customContent:$('custom-content').value.trim(),device}}
    function selectedStudent(){return config?.students.find(s=>s.id===$('student').value)}

function historyStudentChanged(){replacement=null;historySerial++;historyLoading=false;historyFiles=[];historyNext=null;$('history-list').replaceChildren();$('upload-notes').value='';renderExtras();if(!$('history-panel').hidden)loadHistory()}
function closePreview(){$('preview-dialog').close();$('preview-body').replaceChildren();if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}}
function previewLocal(file,name){closePreview();$('preview-title').textContent=name;const ext=file.name.split('.').pop().toLowerCase();if(['jpg','jpeg','png','webp','pdf'].includes(ext)){previewUrl=URL.createObjectURL(ext==='pdf'?new Blob([file],{type:'application/pdf'}):file);const element=document.createElement(ext==='pdf'?'iframe':'img');element.src=previewUrl;if(ext==='pdf')element.title='PDF 預覽';else{element.alt='待上傳照片預覽';element.onerror=()=>{element.replaceWith(document.createTextNode('此裝置無法顯示預覽，仍可上傳原始檔案。'))}}$('preview-body').append(element)}else{const p=document.createElement('p');p.className='dialog-message';p.textContent='此裝置可能無法預覽 HEIC／HEIF，仍可上傳原始照片。';$('preview-body').append(p)}$('preview-dialog').showModal()}
$('preview-close').addEventListener('click',closePreview);$('preview-dialog').addEventListener('cancel',closePreview);
function historyButton(label,handler,danger=false){const button=document.createElement('button');button.type='button';button.className='small-button'+(danger?' danger':'');button.textContent=label;button.addEventListener('click',handler);return button}
function historyRender(){const list=$('history-list');list.replaceChildren();for(const file of historyFiles){const card=document.createElement('article');card.className='history-card';const name=document.createElement('p');name.className='history-name';name.textContent=file.name;const meta=document.createElement('p');meta.className='history-meta';const when=document.createElement('time');when.dateTime=file.modifiedTime;when.textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(file.modifiedTime));meta.append(document.createTextNode(size(file.size)+' · '),when);card.append(name,meta);if(file.notes){const note=document.createElement('p');note.className='history-note';note.textContent=file.notes;card.append(note)}const actions=document.createElement('div');actions.className='history-actions';const view=document.createElement('a');view.className='small-button';view.textContent='查看檔案 ↗';view.href=file.viewUrl;view.target='_blank';view.rel='noopener';actions.append(view,historyButton('修改附註',()=>editNotes(file)),historyButton('重新上傳',()=>replaceUpload(file)),historyButton('刪除',()=>confirmTrash(file),true));card.append(actions);list.append(card)}$('history-more').hidden=!historyNext}
async function loadHistory(more=false){const studentId=$('student').value;if(!studentId){$('history-status').textContent='請先選擇學生姓名。';return}if(historyLoading)return;const serial=++historySerial;historyLoading=true;$('history-refresh').disabled=true;$('history-status').textContent='正在同步雲端…';try{const result=await call('listUploads',studentId,more?historyNext:null);if(serial!==historySerial||studentId!==$('student').value)return;historyFiles=more?[...historyFiles,...result.files]:result.files;historyNext=result.nextPageToken;historyRender();$('history-status').textContent=historyFiles.length?'已與雲端同步 · '+historyFiles.length+' 個檔案':'目前還沒有繳交紀錄。'}catch(e){if(serial===historySerial)$('history-status').textContent=e.message.replace(/^Error:\s*/,'')}finally{if(serial===historySerial){historyLoading=false;$('history-refresh').disabled=false}}}
$('history-refresh').addEventListener('click',()=>loadHistory());$('history-more').addEventListener('click',()=>loadHistory(true));setInterval(()=>{if(historyFiles.length<=30&&!$('history-panel').hidden&&!document.hidden&&!busy&&!$('notes-dialog').open&&!$('trash-dialog').open)loadHistory()},30000);
function editNotes(file){notesTarget={studentId:$('student').value,id:file.id};$('edit-notes').value=file.notes;$('notes-status').textContent='';$('notes-dialog').showModal()}
$('notes-close').addEventListener('click',()=>$('notes-dialog').close());$('notes-save').addEventListener('click',async()=>{if(!notesTarget)return;$('notes-save').disabled=true;$('notes-close').disabled=true;$('notes-status').textContent='正在儲存…';try{await call('updateUploadNotes',notesTarget.studentId,notesTarget.id,$('edit-notes').value);$('notes-dialog').close();loadHistory()}catch(e){$('notes-status').textContent=e.message}finally{$('notes-save').disabled=false;$('notes-close').disabled=false}});
function confirmTrash(file){trashTarget={studentId:$('student').value,id:file.id};$('trash-name').textContent=file.name;$('trash-status').textContent='';$('trash-dialog').showModal()}
$('trash-cancel').addEventListener('click',()=>$('trash-dialog').close());$('trash-confirm').addEventListener('click',async()=>{if(!trashTarget)return;$('trash-confirm').disabled=true;$('trash-cancel').disabled=true;$('trash-status').textContent='正在移至垃圾桶…';try{await call('trashUpload',trashTarget.studentId,trashTarget.id);$('trash-dialog').close();loadHistory()}catch(e){$('trash-status').textContent=e.message}finally{$('trash-confirm').disabled=false;$('trash-cancel').disabled=false}});
function replaceUpload(file){if(busy||items.some(x=>x.status!=='success')){$('history-status').textContent='請先完成或移除待上傳的檔案。';return}replacement=file;clearItems();const d=file.details||{};const category=['homework','exam','custom'].includes(d.category)?d.category:'homework';document.querySelector('input[name=category][value='+category+']').checked=true;$('custom-category').value=d.customCategory||'';if(selectedStudent()?.terms.some(t=>t.key===d.termKey))$('term').value=d.termKey;populateContents();if([...$('content').options].some(o=>o.value===d.content))$('content').value=d.content;else $('content').value='custom';$('custom-content').value=d.customContent||d.content||'';$('upload-notes').value=file.notes;metadataChanged();switchTab('upload');$('replace-name').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
$('replace-cancel').addEventListener('click',()=>{if(busy)return;replacement=null;clearItems();render()});
</script>
