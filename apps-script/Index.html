  <script>try{document.documentElement.dataset.theme=localStorage.getItem('math-upload-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 5h10M7 19h10M16 5l-7 7 7 7"/></svg></span>數學家教</div>
      <div class="controls"><button class="view-switch" id="view-switch" type="button" aria-label="切換手機版"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span id="view-text">電腦版</span></button><button class="theme" id="theme" type="button" aria-label="切換暗黑模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><span id="theme-text">暗黑模式</span></button></div>
    </header>
    <main>
      <section class="intro" aria-labelledby="title"><p class="eyebrow">HOMEWORK / 作業與考卷</p><h1 id="title">作業繳交</h1><p>選擇姓名，將今天的練習交給老師。</p></section>
      <section class="card" aria-label="檔案上傳">
        <div class="student-row"><label class="student-label" for="student">學生姓名</label><div class="select-wrap"><select id="student" disabled><option value="">正在載入名單…</option></select></div></div>
        <div class="hello"><div><h2 id="greeting">你好，歡迎回來</h2><p>請在這裡上傳作業或考卷。</p></div></div>
        <span class="badge" id="course" hidden></span>
        <nav class="tabs" role="tablist" aria-label="作業功能"><button class="tab" id="tab-upload" type="button" role="tab" aria-selected="true" aria-controls="upload-panel">作業繳交</button><button class="tab" id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">作業查看</button></nav>
        <section id="upload-panel" role="tabpanel" aria-labelledby="tab-upload">
        <div class="deadline-box" id="deadline-box" hidden><p class="deadline-title" id="deadline-title">距離作業截止</p><div class="countdown" aria-live="off"><div><span id="due-days">--</span><small>天</small></div><div><span id="due-hours">--</span><small>時</small></div><div><span id="due-minutes">--</span><small>分</small></div><div><span id="due-seconds">--</span><small>秒</small></div></div><p class="deadline-date" id="deadline-date"></p></div>
        <div class="submission-fields">
          <fieldset id="category-group"><legend>這次繳交的是</legend><div class="pills">
            <label class="pill"><input type="radio" name="category" value="exam"><span>考試</span></label>
            <label class="pill"><input type="radio" name="category" value="homework" checked><span>作業</span></label>
            <label class="pill"><input type="radio" name="category" value="custom"><span>自訂</span></label>
          </div><div class="custom-field" id="custom-category-field" hidden><label for="custom-category">自訂類型</label><input id="custom-category" type="text" maxlength="30" placeholder="例如：課前資料" autocomplete="off"></div></fieldset>
          <div><div class="content-head"><label class="field-label" for="content">繳交內容 · <span id="publisher-label">南一版</span></label><div class="select-wrap term-wrap"><select id="term" aria-label="教材學期" disabled><option value="">載入中</option></select></div></div><div class="select-wrap"><select id="content"><option value="">請選擇內容</option></select></div><div class="custom-field" id="custom-content-field" hidden><label for="custom-content">自訂內容</label><input id="custom-content" type="text" maxlength="30" placeholder="例如：第一次段考訂正" autocomplete="off"></div></div>
          <p class="filename-preview" id="filename-preview">選好類型與內容後，會自動產生檔名。</p>
        </div>
        <div class="replace-banner" id="replace-banner" hidden><div id="replace-name"></div><button class="small-button" id="replace-cancel" type="button">取消重新上傳</button></div>
        <label class="drop" id="drop" for="files">
          <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></span>
          <strong>點選照片或 PDF</strong><span class="desktop-hint">也可以把檔案拖曳到這裡</span><small>每檔上限 10 MB · 可一次選擇多個檔案</small>
          <input class="file-input" id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.heic,.heif,.pdf,image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf" aria-label="選擇照片或 PDF" disabled>
        </label>
        <div class="notes-field"><label for="upload-notes">附註（選填）</label><textarea id="upload-notes" maxlength="2000" placeholder="例如：第 3 題想請老師再講解一次。"></textarea></div>
        <div class="error-box" id="errors" role="alert" hidden></div>
        <ul class="queue" id="queue" aria-label="待上傳檔案"></ul>
        <div class="actions"><button class="primary" id="upload" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>開始上傳</span></button><p class="summary" id="summary" role="status" aria-live="polite">請等候「上傳成功」再關閉頁面。</p></div>
        </section>
        <section id="history-panel" role="tabpanel" aria-labelledby="tab-history" hidden><div class="history-head"><h3>雲端繳交紀錄</h3><button id="history-refresh" class="small-button" type="button">重新整理</button></div><p class="history-meta">可查看檔案、修改附註，或重新上傳。此頁每 30 秒同步。</p><div id="history-list"></div><p id="history-status" class="history-empty" role="status" aria-live="polite"></p><button class="small-button" id="history-more" type="button" hidden>載入更多</button></section>
      </section>
    </main>
    <footer class="foot"><span>檔案交給老師，學習慢慢累積。</span><a href="https://lee200202.github.io/parent-homework-upload/admin.html" target="_top">學生與截止時間管理</a></footer>
  </div>
  <dialog id="preview-dialog"><div class="dialog-head"><h3 id="preview-title">檔案預覽</h3><button class="small-button" id="preview-close" type="button">關閉</button></div><div class="preview-body" id="preview-body"></div></dialog>
  <dialog id="notes-dialog"><div class="dialog-head"><h3>修改附註</h3><button class="small-button" id="notes-close" type="button">取消</button></div><label class="field-label" for="edit-notes">附註（最多 2000 字）</label><textarea id="edit-notes" maxlength="2000"></textarea><p class="dialog-message" id="notes-status" role="status"></p><div class="dialog-actions"><button class="small-button" id="notes-save" type="button">儲存附註</button></div></dialog>
  <dialog id="trash-dialog"><div class="dialog-head"><h3>將檔案移至垃圾桶？</h3></div><p class="dialog-message" id="trash-name"></p><p class="dialog-message">移除後可由老師在 Google Drive 垃圾桶復原。</p><p class="dialog-message" id="trash-status" role="status"></p><div class="dialog-actions"><button class="small-button" id="trash-cancel" type="button">取消</button><button class="small-button danger" id="trash-confirm" type="button">移至垃圾桶</button></div></dialog>
  <script>
    'use strict';
    const $=id=>document.getElementById(id);
    const icons={file:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',remove:'<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>'};
    let config,items=[],busy=false,selecting=false;
    const device=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'mobile':'desktop';

    function theme(){const dark=document.documentElement.dataset.theme==='dark';$('theme-text').textContent=dark?'明亮模式':'暗黑模式';$('theme').setAttribute('aria-label',dark?'切換明亮模式':'切換暗黑模式');$('theme').setAttribute('aria-pressed',String(dark))}

    function size(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
    function status(item){if(item.status==='success')return '上傳成功 · 收件碼 '+item.receipt;if(item.status==='failed')return item.error||'上傳未完成，請重試';if(item.status==='uploading')return item.percent===100?'正在確認存檔…':'正在接收 '+item.percent+'%';return '等待上傳'}

    async function signature(file){const b=new Uint8Array(await file.slice(0,40).arrayBuffer());const a=Array.from(b,v=>String.fromCharCode(v)).join('');const ext=file.name.split('.').pop().toLowerCase();return ext==='pdf'?a.startsWith('%PDF-'):['jpg','jpeg'].includes(ext)?b[0]===255&&b[1]===216&&b[2]===255:ext==='png'?Array.from(b.slice(0,8)).join(',')==='137,80,78,71,13,10,26,10':ext==='webp'?a.startsWith('RIFF')&&a.slice(8,12)==='WEBP':['heic','heif'].includes(ext)&&a.slice(4,8)==='ftyp'&&/heic|heix|hevc|hevx|mif1|msf1/.test(a.slice(8))}
    async function addFiles(files){if(busy||selecting||!config||!$('student').value)return;if(replacement&&(files.length!==1||items.some(x=>x.status!=='success'))){errors('重新上傳時請一次選擇一個檔案。');return}selecting=true;render();const problems=[];for(const file of Array.from(files)){

    $('student').addEventListener('change',()=>{items=[];errors('');studentChanged()});$('files').addEventListener('change',e=>addFiles(e.target.files));
    for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();if(!busy)$('drop').classList.add('drag')});

    window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
    function base64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('無法讀取檔案，請重新選檔。'));reader.readAsDataURL(blob)})}

    async function loadConfig(){const oldId=$('student').value;try{const next=await call('getConfig');clockOffset=next.serverNow-Date.now();if(config&&next.revision===config.revision&&next.schoolDate===config.schoolDate)return;config=next;$('student').replaceChildren(new Option('請選擇你的名字',''));for(const s of config.students)$('student').append(new Option(s.course+' · '+s.name,s.id));if(config.students.some(s=>s.id===oldId))$('student').value=oldId;else if(config.students.length===1)$('student').value=config.students[0].id;studentChanged()}catch(e){if(!config){$('student').replaceChildren(new Option('暫時無法載入名單',''));errors('暫時無法連線，請重新整理頁面。若仍無法使用，請聯絡老師。')}}}

<script>
'use strict';
let clockOffset=0,replacement=null,historyFiles=[],historyNext=null,historyLoading=false,historySerial=0,previewUrl=null,notesTarget=null,trashTarget=null;
function tickDeadline(){const student=selectedStudent();const kind=document.querySelector('input[name=category]:checked').value==='exam'?'exam':'homework';let due=Date.parse(student?.deadlines?.[kind]||'');$('deadline-box').hidden=!Number.isFinite(due);if(!Number.isFinite(due))return;const now=Date.now()+clockOffset;while(due<now)due+=604800000;let seconds=Math.max(0,Math.floor((due-now)/1000));const days=Math.floor(seconds/86400);seconds%=86400;const hours=Math.floor(seconds/3600);seconds%=3600;const minutes=Math.floor(seconds/60);seconds%=60;$('due-days').textContent=days;$('due-hours').textContent=String(hours).padStart(2,'0');$('due-minutes').textContent=String(minutes).padStart(2,'0');$('due-seconds').textContent=String(seconds).padStart(2,'0');$('deadline-title').textContent='距離'+(kind==='exam'?'考試':'作業')+'截止';$('deadline-date').textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(due))+' 前繳交';}
setInterval(tickDeadline,1000);

for(const key of ['upload','history']){$('tab-'+key).addEventListener('click',()=>switchTab(key));$('tab-'+key).addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'upload':e.key==='End'?'history':key==='upload'?'history':'upload';switchTab(next);$('tab-'+next).focus()}})}

function closePreview(){$('preview-dialog').close();$('preview-body').replaceChildren();if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}}
function previewLocal(file,name){closePreview();$('preview-title').textContent=name;const ext=file.name.split('.').pop().toLowerCase();if(['jpg','jpeg','png','webp','pdf'].includes(ext)){previewUrl=URL.createObjectURL(ext==='pdf'?new Blob([file],{type:'application/pdf'}):file);const element=document.createElement(ext==='pdf'?'iframe':'img');element.src=previewUrl;if(ext==='pdf')element.title='PDF 預覽';else{element.alt='待上傳照片預覽';element.onerror=()=>{element.replaceWith(document.createTextNode('此裝置無法顯示預覽，仍可上傳原始檔案。'))}}$('preview-body').append(element)}else{const p=document.createElement('p');p.className='dialog-message';p.textContent='此裝置可能無法預覽 HEIC／HEIF，仍可上傳原始照片。';$('preview-body').append(p)}$('preview-dialog').showModal()}
$('preview-close').addEventListener('click',closePreview);$('preview-dialog').addEventListener('cancel',closePreview);
function historyButton(label,handler,danger=false){const button=document.createElement('button');button.type='button';button.className='small-button'+(danger?' danger':'');button.textContent=label;button.addEventListener('click',handler);return button}
function historyRender(){const list=$('history-list');list.replaceChildren();for(const file of historyFiles){const card=document.createElement('article');card.className='history-card';const name=document.createElement('p');name.className='history-name';name.textContent=file.name;const meta=document.createElement('p');meta.className='history-meta';meta.textContent=size(file.size)+' · '+new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(file.modifiedTime));card.append(name,meta);if(file.notes){const note=document.createElement('p');note.className='history-note';note.textContent=file.notes;card.append(note)}const actions=document.createElement('div');actions.className='history-actions';const view=document.createElement('a');view.className='small-button';view.textContent='查看檔案 ↗';view.href=file.viewUrl;view.target='_blank';view.rel='noopener';actions.append(view,historyButton('修改附註',()=>editNotes(file)),historyButton('重新上傳',()=>replaceUpload(file)),historyButton('刪除',()=>confirmTrash(file),true));card.append(actions);list.append(card)}$('history-more').hidden=!historyNext}
async function loadHistory(more=false){const studentId=$('student').value;if(!studentId){$('history-status').textContent='請先選擇學生姓名。';return}if(historyLoading)return;const serial=++historySerial;historyLoading=true;$('history-refresh').disabled=true;$('history-status').textContent='正在同步雲端…';try{const result=await call('listUploads',studentId,more?historyNext:null);if(serial!==historySerial||studentId!==$('student').value)return;historyFiles=more?[...historyFiles,...result.files]:result.files;historyNext=result.nextPageToken;historyRender();$('history-status').textContent=historyFiles.length?'已與雲端同步 · '+historyFiles.length+' 個檔案':'目前還沒有繳交紀錄。'}catch(e){if(serial===historySerial)$('history-status').textContent=e.message.replace(/^Error:\s*/,'')}finally{if(serial===historySerial){historyLoading=false;$('history-refresh').disabled=false}}}

function editNotes(file){notesTarget={studentId:$('student').value,id:file.id};$('edit-notes').value=file.notes;$('notes-status').textContent='';$('notes-dialog').showModal()}
$('notes-close').addEventListener('click',()=>$('notes-dialog').close());$('notes-save').addEventListener('click',async()=>{if(!notesTarget)return;$('notes-save').disabled=true;$('notes-close').disabled=true;$('notes-status').textContent='正在儲存…';try{await call('updateUploadNotes',notesTarget.studentId,notesTarget.id,$('edit-notes').value);$('notes-dialog').close();loadHistory()}catch(e){$('notes-status').textContent=e.message}finally{$('notes-save').disabled=false;$('notes-close').disabled=false}});
function confirmTrash(file){trashTarget={studentId:$('student').value,id:file.id};$('trash-name').textContent=file.name;$('trash-status').textContent='';$('trash-dialog').showModal()}
$('trash-cancel').addEventListener('click',()=>$('trash-dialog').close());$('trash-confirm').addEventListener('click',async()=>{if(!trashTarget)return;$('trash-confirm').disabled=true;$('trash-cancel').disabled=true;$('trash-status').textContent='正在移至垃圾桶…';try{await call('trashUpload',trashTarget.studentId,trashTarget.id);$('trash-dialog').close();loadHistory()}catch(e){$('trash-status').textContent=e.message}finally{$('trash-confirm').disabled=false;$('trash-cancel').disabled=false}});
function replaceUpload(file){if(busy||items.some(x=>x.status!=='success')){$('history-status').textContent='請先完成或移除待上傳的檔案。';return}replacement=file;items=[];const d=file.details||{};const category=['homework','exam','custom'].includes(d.category)?d.category:'homework';document.querySelector('input[name=category][value='+category+']').checked=true;$('custom-category').value=d.customCategory||'';if(selectedStudent()?.terms.some(t=>t.key===d.termKey))$('term').value=d.termKey;populateContents();if([...$('content').options].some(o=>o.value===d.content))$('content').value=d.content;else $('content').value='custom';$('custom-content').value=d.customContent||d.content||'';$('upload-notes').value=file.notes;metadataChanged();switchTab('upload');$('replace-name').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}

</script>
